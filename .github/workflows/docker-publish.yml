name: Build and Push Docker Image

on:
  push:
    branches: ["master"]
    paths:
      - 'docker/opencode/**'
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  RAW_IMAGE_NAME: ${{ github.repository }}/opencode

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Convert image name to lowercase
        id: prep
        run: |
          LOWCASE_IMAGE_NAME=$(echo "${{ env.RAW_IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${LOWCASE_IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.prep.outputs.image_name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./docker/opencode
          file: ./docker/opencode/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup old images
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract owner and repo name
          OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          
          echo "Owner: ${OWNER}, Repo: ${REPO_NAME}"
          
          # Determine API endpoint based on owner type
          if [ "${{ github.repository_owner_type }}" = "Organization" ]; then
            API_BASE="/orgs/${OWNER}/packages/container/${REPO_NAME}/opencode"
          else
            API_BASE="/user/packages/container/${REPO_NAME}/opencode"
          fi
          
          echo "API endpoint: ${API_BASE}"
          
          # List all versions (with error output)
          echo "Fetching versions..."
          RESPONSE=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_BASE}/versions?per_page=100" 2>&1)
          
          echo "Response: ${RESPONSE}"
          
          # Extract version IDs to delete (keep latest 2)
          VERSIONS=$(echo "$RESPONSE" | jq -r 'if type == "array" then sort_by(.created_at) | reverse | .[2:] | .[].id else empty end' 2>/dev/null || echo "")
          
          if [ -z "$VERSIONS" ]; then
            echo "No versions to clean up"
            exit 0
          fi
          
          echo "Versions to delete: ${VERSIONS}"
          
          # Delete versions beyond the latest 2
          for VERSION_ID in $VERSIONS; do
            echo "Deleting version ${VERSION_ID}..."
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_BASE}/versions/${VERSION_ID}" && echo "Deleted ${VERSION_ID}" || echo "Failed to delete ${VERSION_ID}"
          done
