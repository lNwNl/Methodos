<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Methodos</title>
  <link rel="stylesheet" href="/output.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-json-enc@2.0.0/json-enc.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-8">
      <h1 class="text-2xl font-bold tracking-tight">Methodos</h1>
      <button onclick="document.getElementById('create-modal').classList.remove('hidden')"
        class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
        + 新建项目
      </button>
    </div>

    <div id="create-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
      <div class="bg-gray-900 border border-gray-700 rounded-xl p-6 w-full max-w-md mx-4">
        <h2 class="text-lg font-semibold mb-4">新建项目</h2>
        <form hx-post="/projects" hx-ext="json-enc" hx-target="#project-list" hx-swap="innerHTML"
          hx-on::after-request="if(event.detail.successful) { document.getElementById('create-modal').classList.add('hidden'); this.reset(); }">
          <div class="space-y-4">
            <div>
              <label class="block text-sm text-gray-400 mb-1">描述</label>
              <textarea name="title" rows="2" required
                class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 resize-none"
                placeholder="帮我拿到 flag。https://hackme.com"></textarea>
            </div>
            <div>
              <label class="block text-sm text-gray-400 mb-1">Agent 类型</label>
              <select name="agent_type" id="agent-type-select" required
                class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
              </select>
            </div>
          </div>
          <div class="flex justify-end gap-3 mt-6">
            <button type="button" onclick="document.getElementById('create-modal').classList.add('hidden')"
              class="px-4 py-2 text-sm text-gray-400 hover:text-white transition-colors">取消</button>
            <button type="submit"
              class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">创建</button>
          </div>
        </form>
      </div>
    </div>

    <div hx-get="/projects-list" hx-trigger="load, every 2s, projectCreated, projectUpdated, projectPushed" hx-swap="innerHTML" id="project-list">
      <div class="text-center text-gray-500 py-12">
        <div class="inline-block w-5 h-5 border-2 border-gray-600 border-t-emerald-400 rounded-full animate-spin mr-2 align-middle"></div>
        加载中...
      </div>
    </div>
  </div>

  <script>
    fetch('/mode').then(r => r.json()).then(data => {
      const sel = document.getElementById('agent-type-select');
      if (data.docker) {
        sel.innerHTML = '<option value="opencode">OpenCode</option><option value="mock">Mock（测试）</option>';
      } else {
        sel.innerHTML = '<option value="mock">Mock（测试）</option>';
      }
    });
  </script>
</body>
</html>
