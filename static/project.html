<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Methodos — 项目详情</title>
  <link rel="stylesheet" href="/output.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
  <script defer src="/app.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <div class="max-w-7xl mx-auto px-4 py-4">
    <div class="flex items-center justify-between mb-4">
      <a href="/" class="text-gray-400 hover:text-white text-sm">&larr; 返回</a>
      <div class="flex gap-2">
        <button id="stop-btn" class="px-3 py-1.5 text-xs rounded-lg bg-amber-900/50 text-amber-400 hover:bg-amber-900 border border-amber-800 transition-colors hidden"
          hx-post="" hx-swap="none">暂停</button>
        <button id="push-btn" class="px-3 py-1.5 text-xs rounded-lg bg-blue-900/50 text-blue-400 hover:bg-blue-900 border border-blue-800 transition-colors hidden"
          onclick="showPushModal()">推进</button>
      </div>
    </div>

    <div id="summary-bar" class="hidden bg-gray-900 border border-emerald-800 rounded-xl p-4 mb-4">
      <div class="flex items-start gap-3">
        <span class="text-emerald-400 font-bold text-sm">完成</span>
        <p id="summary-text" class="text-sm text-gray-300"></p>
      </div>
    </div>

    <div class="flex gap-4" style="height: 70vh">
      <div class="flex-1 min-w-0 bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
        <div id="graph" style="width:100%;height:100%"></div>
      </div>

      <div id="detail-panel" class="hidden w-80 shrink-0 bg-gray-900 border border-gray-700 rounded-xl p-4 overflow-y-auto">
        <div class="flex items-center justify-between mb-2">
          <h3 id="detail-title" class="font-semibold text-sm"></h3>
          <button onclick="document.getElementById('detail-panel').classList.add('hidden')" class="text-gray-500 hover:text-white text-lg leading-none">&times;</button>
        </div>
        <div id="detail-body" class="text-sm text-gray-400"></div>
      </div>
    </div>

    <div id="push-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
      <div class="bg-gray-900 border border-gray-700 rounded-xl p-6 w-full max-w-md mx-4">
        <h2 class="text-lg font-semibold mb-4">推进项目</h2>
        <form id="push-form">
          <div class="space-y-3">
            <div id="push-nodes"></div>
            <button type="button" onclick="addPushNode()"
              class="text-xs text-emerald-400 hover:text-emerald-300">+ 添加信息</button>
          </div>
          <div class="flex justify-end gap-3 mt-6">
            <button type="button" onclick="document.getElementById('push-modal').classList.add('hidden')"
              class="px-4 py-2 text-sm text-gray-400 hover:text-white transition-colors">取消</button>
            <button type="submit"
              class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">提交</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
